<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>
  <body>

    <div class="container">
      <div class="shadow mb-5 rounded">
        <h1 class="text-center p-4 fw-bold text-uppercase font-monospace bg-dark bg-gradient text-white">Student Registration Form</h1>
      </div>
      <div class="d-flex flex-column align-items-center justify-content-between gap-3">
        <div class="input-group flex-nowrap">
          <span class="input-group-text" id="addon-wrapping">Student Name</span>
          <input type="text" id="name" class="form-control shadow-none" placeholder="Enter your name" aria-label="Username" aria-describedby="addon-wrapping">
        </div>
        <div class="input-group flex-nowrap">
          <span class="input-group-text" id="addon-wrapping">Father Name</span>
          <input type="text" id="fatherName" class="form-control shadow-none" placeholder="Enter your father name" aria-label="Username" aria-describedby="addon-wrapping">
        </div>
        <div class="input-group flex-nowrap">
          <span class="input-group-text" id="addon-wrapping">Contact</span>
          <input type="text" id="contact" class="form-control shadow-none" placeholder="Enter your father name" aria-label="Username" aria-describedby="addon-wrapping">
        </div>
        <div class="input-group flex-nowrap">
          <span class="input-group-text" id="addon-wrapping">Father Name</span>
          <input type="text" id="fatherName" class="form-control shadow-none" placeholder="Enter your father name" aria-label="Username" aria-describedby="addon-wrapping">
        </div>
        <div class="input-group flex-nowrap">
          <span class="input-group-text" id="addon-wrapping">Roll Number</span>
          <input type="text" id="rollNum" class="form-control shadow-none" placeholder="Enter roll number" aria-label="Username" aria-describedby="addon-wrapping">
        </div>
        <div class="input-group mb-3" id="courseDropDown">
          <label class="input-group-text" for="inputGroupSelect01">Courses</label>
          <select class="form-select shadow-none" aria-placeholder="Select Course" id="inputGroupSelect01">
            <option >Web and Mobile App Dev</option>
            <option >Graphic designing</option>
            <option >Dart and Flutter</option>
            <option >Python programming</option>
            <option >Digital Marketing</option>
          </select>
        </div>
      </div>
      <!-- <br /> -->
      <div class="d-flex justify-content-between">
        <button onclick="submitData()" class="btn btn-success">Submit</button>
        <button onclick="getUserData()" class="btn btn-primary">Show Data</button>
      </div>
    </div>

       

    <div class="container">
      <div class="shadow mb-5 bg-body rounded mt-3">
        <h1 class="p-3 text-center fw-bold font-monospace bg-secondary bg-gradient">Students Information</h1>
      </div>
      <table class="table table-dark table-striped table-hover">
        <thead>
          <tr class="text-center fs-5">
            <th>Student Name</th>
            <th>Roll Number</th>
            <th>Course</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="data-table-body">
          <!-- Data will be inserted here -->
        </tbody>
      </table>
    </div>

    <!-- <input type="text" name="" id="inp"> 
    <button onclick="addData()">Add</button> -->

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="JS/app.js"></script>
  </body>
</html>
